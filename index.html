<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>캠핑 출발 준비 매니저</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#425443">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="캠핑 매니저">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
 --bg:#f3f0e9;--card:#fffdf8;--ink:#272722;--muted:#777166;--line:#ddd6c8;
 --accent:#425443;--accent2:#d8c7a1;--ok:#3d6e4e;--warn:#ad7a2b;--bad:#a64b3c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",sans-serif}
button,input,select{font:inherit}
.app{max-width:820px;margin:auto;padding:16px 14px 110px}
header{padding:8px 4px 14px}
h1{margin:0;font-size:26px}.sub{color:var(--muted);font-size:13px;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 4px 20px #00000008}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
button{border:1px solid var(--line);background:white;border-radius:12px;padding:11px 10px;color:var(--ink)}
button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
button.ghost{background:transparent}
button.bad{color:var(--bad)}
.small{font-size:12px;color:var(--muted)}
.section-title{font-weight:700;font-size:17px;margin:18px 4px 8px}
.choice-title{font-size:13px;color:var(--muted);margin-bottom:7px}
.status{display:flex;justify-content:space-between;align-items:center;gap:10px}
.badge{font-size:12px;padding:5px 8px;border-radius:999px;border:1px solid var(--line)}
.badge.ok{color:var(--ok);border-color:#b8d0bf;background:#eef7f0}
.badge.warn{color:var(--warn);border-color:#ddc89d;background:#fff8e8}
.badge.bad{color:var(--bad);border-color:#dfb6ae;background:#fff0ed}
.progress{height:8px;background:#e7e2d8;border-radius:99px;overflow:hidden;margin-top:10px}
.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.alert{border-left:4px solid var(--warn);background:#fff8e8;padding:10px 12px;border-radius:10px;margin:8px 0;font-size:13px}
.alert.bad{border-left-color:var(--bad);background:#fff0ed}
.item{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid #eee8dd}
.item:last-child{border-bottom:0}.item input{width:20px;height:20px;accent-color:var(--accent)}
.item .name{flex:1}.item.done .name{text-decoration:line-through;color:#aaa}
.item .meta{font-size:11px;color:var(--muted)}
.item .more{border:0;padding:4px 8px;background:transparent;font-size:20px}
details{border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:13px}
.kit{padding:10px 0}.kit-head{display:flex;align-items:center;gap:10px}.kit-head input{width:20px;height:20px}
.kit-items{padding:4px 0 0 30px;font-size:12px;color:var(--muted);line-height:1.8}
.toolbar{position:fixed;left:0;right:0;bottom:0;background:#ffffffee;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.toolbar-inner{max-width:820px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}
.modal.show{display:flex}.sheet{background:var(--card);width:100%;max-width:820px;margin:auto;border-radius:20px 20px 0 0;padding:18px 14px 24px;max-height:80vh;overflow:auto}
.sheet h3{margin:0 0 12px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.history{font-size:12px;color:var(--warn)}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}.toolbar-inner{grid-template-columns:1fr 1fr 1fr}h1{font-size:23px}}
</style>
</head>
<body>
<div class="app">
<header>
<h1>🏕️ 캠핑 출발 준비 매니저</h1>
<div class="sub">이번 캠핑에 필요한 장비만 자동 구성 · 복수 선택 · 누락 경고 · 철수 체크 · 내 장비 직접 편집</div>
</header>

<div class="card">
<div class="section-title" style="margin-top:0">STEP 1 · 이번 캠핑 설정</div>

<div class="choice-title">인원</div>
<div class="grid2">
<button id="people1" onclick="setCfg('people',1)">🧍 1인</button>
<button id="people2" onclick="setCfg('people',2)">👥 2인</button>
</div>

<div class="choice-title" style="margin-top:12px">숙박</div>
<div class="grid3">
<button data-nights="0" onclick="setCfg('nights',0)">당일</button>
<button data-nights="1" onclick="setCfg('nights',1)">1박</button>
<button data-nights="2" onclick="setCfg('nights',2)">2박+</button>
</div>

<div class="choice-title" style="margin-top:12px">텐트 / 쉘터 선택</div>
<div id="shelterChoices" class="grid2"></div>

<div class="choice-title" style="margin-top:12px">타프 선택</div>
<div id="tarpChoices" class="grid2"></div>

<div class="choice-title" style="margin-top:12px">체어 선택 · 복수 선택</div>
<div id="chairChoices" class="grid2"></div>

<div class="choice-title" style="margin-top:12px">취사</div>
<div class="grid3">
<button data-cook="simple" onclick="setCfg('cook','simple')">간단식</button>
<button data-cook="normal" onclick="setCfg('cook','normal')">일반 취사</button>
<button data-cook="bbq" onclick="setCfg('cook','bbq')">바비큐</button>
</div>

<div class="choice-title" style="margin-top:12px">날씨 / 계절</div>
<div class="grid3">
<button data-weather="normal" onclick="setCfg('weather','normal')">☀️ 일반</button>
<button data-weather="rain" onclick="setCfg('weather','rain')">🌧️ 우천</button>
<button data-weather="winter" onclick="setCfg('weather','winter')">❄️ 동계</button>
<button data-weather="summer" onclick="setCfg('weather','summer')">🔥 혹서</button>
</div>

<div class="choice-title" style="margin-top:12px">즐길거리</div>
<div class="grid3">
<button data-pack="coffee" onclick="togglePack('coffee')">☕ 커피</button>
<button data-pack="movie" onclick="togglePack('movie')">🎬 영화</button>
<button data-pack="fire" onclick="togglePack('fire')">🔥 불멍</button>
<button data-pack="music" onclick="togglePack('music')">🎸 음악</button>
<button data-pack="hike" onclick="togglePack('hike')">🥾 하이킹</button>
<button data-pack="none" onclick="clearPacks()">선택 안 함</button>
</div>
</div>

<div class="card">
<div class="status">
<div>
<div class="small">출발 상태</div>
<strong id="statusText">준비 중</strong>
</div>
<span id="statusBadge" class="badge warn">확인 필요</span>
</div>
<div class="progress"><div id="progressFill"></div></div>
<div class="small" id="progressText" style="margin-top:7px">0 / 0</div>
<div id="alerts"></div>
</div>

<div id="kitsArea"></div>
<div id="checklist"></div>

<div class="card">
<div class="section-title" style="margin-top:0">⚠️ 최근 누락 기록</div>
<div class="small">캠핑장에서 깜빡한 장비를 기록하면 다음 출발 시 상단 경고로 표시됩니다.</div>
<div id="missedList" style="margin-top:10px"></div>
<button style="margin-top:10px;width:100%" onclick="openMissedModal()">＋ 이번에 깜빡한 물건 기록</button>
</div>

<div class="toolbar">
<div class="toolbar-inner">
<button onclick="switchMode('depart')" id="departBtn">🚙 출발</button>
<button onclick="switchMode('retreat')" id="retreatBtn">🏕️ 철수</button>
<button onclick="openAddModal()">＋ 장비</button>
</div>
</div>

<div id="editModal" class="modal" onclick="if(event.target===this)closeModal('editModal')">
<div class="sheet">
<h3 id="editTitle">장비 편집</h3>
<div class="field"><label>장비명</label><input id="editName"></div>
<div class="field"><label>카테고리</label><select id="editCategory"></select></div>
<div class="field"><label>중요도</label><select id="editRequired"><option value="true">필수</option><option value="false">선택</option></select></div>
<div class="sheet-actions"><button onclick="saveEdit()">저장</button><button class="bad" onclick="deleteEdit()">삭제</button></div>
<button style="width:100%;margin-top:8px" onclick="closeModal('editModal')">취소</button>
</div></div>

<div id="addModal" class="modal" onclick="if(event.target===this)closeModal('addModal')">
<div class="sheet">
<h3>장비 추가</h3>
<div class="field"><label>장비명</label><input id="addName" placeholder="예: 블루투스 스피커"></div>
<div class="field"><label>카테고리</label><select id="addCategory"></select></div>
<div class="field"><label>중요도</label><select id="addRequired"><option value="true">필수</option><option value="false">선택</option></select></div>
<div class="sheet-actions"><button onclick="saveAdd()">추가</button><button onclick="closeModal('addModal')">취소</button></div>
</div></div>

<div id="missedModal" class="modal" onclick="if(event.target===this)closeModal('missedModal')">
<div class="sheet">
<h3>이번에 깜빡한 물건</h3>
<div class="field"><label>장비명</label><input id="missedName" placeholder="예: 가스"></div>
<div class="sheet-actions"><button onclick="saveMissed()">기록</button><button onclick="closeModal('missedModal')">취소</button></div>
</div></div>

function clone(x){return JSON.parse(JSON.stringify(x))}
let state=load();
function load(){
 try{
  const s=JSON.parse(localStorage.getItem(STORAGE)||'null');
  if(!s) return clone(DEFAULTS);
  const d=clone(DEFAULTS);
  return {...d,...s,config:{...d.config,...(s.config||{})},items:s.items||d.items,categories:s.categories||d.categories,kits:s.kits||d.kits,retreat:s.retreat||d.retreat};
 }catch(e){return clone(DEFAULTS)}
}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function setCfg(k,v){state.config[k]=v;save();render()}
function togglePack(p){let a=state.config.packs||[];state.config.packs=a.includes(p)?a.filter(x=>x!==p):[...a,p];save();render()}
function clearPacks(){state.config.packs=[];save();render()}
function toggleChair(ch){
 let a=state.config.chairs||[];
 state.config.chairs=a.includes(ch)?a.filter(x=>x!==ch):[...a,ch];
 save();render()
}
function switchMode(m){state.mode=m;save();render()}

const shelterOpts=[['hubba','MSR 허바허바 LT2'],['living','스노우피크 리빙쉘'],['landlock','스노우피크 랜드록']];
const tarpOpts=[['none','사용 안 함'],['black','블랙코팅 타프'],['buffalo','버팔로 타프']];
const chairOpts=[
 ['sunset','헬리녹스 선셋체어'],
 ['savanna','헬리녹스 사바나체어'],
 ['cargo_khaki','카고컨테이너 체어 카키'],
 ['cargo_tan','카고컨테이너 체어 탄'],
 ['kazmi','카즈미 체어'],
 ['bp_white','백패킹 체어 화이트'],
 ['bp_orange','백패킹 체어 오렌지']
];

function hasTag(item,tag){return (item.tags||[]).includes(tag)}
function activeItem(item){
 const c=state.config;
 const packs=c.packs||[];
 if((item.tags||[]).some(t=>t.startsWith('shelter:'))) return hasTag(item,'shelter:'+c.shelter);
 if((item.tags||[]).some(t=>t.startsWith('tarp:'))){
   if(c.tarp==='none') return false;
   return hasTag(item,'tarp:'+c.tarp)||hasTag(item,'tarp:any');
 }
 if((item.tags||[]).some(t=>t.startsWith('chair:'))) return (c.chairs||[]).some(ch=>hasTag(item,'chair:'+ch));
 if((item.tags||[]).some(t=>t.startsWith('sleep:'))) return c.nights>0 && hasTag(item,'sleep:any');
 if((item.tags||[]).some(t=>t.startsWith('cook:'))) return hasTag(item,'cook:any')||hasTag(item,'cook:'+c.cook);
 if(hasTag(item,'coffee')) return packs.includes('coffee');
 if(hasTag(item,'movie')) return packs.includes('movie');
 if(hasTag(item,'fire')) return packs.includes('fire');
 if(hasTag(item,'music')) return packs.includes('music');
 if(hasTag(item,'hike')) return packs.includes('hike');
 if(hasTag(item,'rain')) return c.weather==='rain';
 if(hasTag(item,'winter')) return c.weather==='winter';
 if(hasTag(item,'summer')) return c.weather==='summer';
 return hasTag(item,'camp') || (item.tags||[]).length===0;
}
function activeItems(){return state.items.filter(activeItem)}

const deps=[
 ['igt2',['igtleg'],'IGT 테이블을 선택했지만 테이블 다리가 확인되지 않았습니다.'],
 ['burner',['gas','lighter'],'버너를 선택했지만 가스 또는 라이터가 확인되지 않았습니다.'],
 ['blacktarp',['tarppole','guyline','hammer'],'타프를 선택했지만 설치 장비가 모두 확인되지 않았습니다.'],
 ['buffalotarp',['tarppole','guyline','hammer'],'타프를 선택했지만 설치 장비가 모두 확인되지 않았습니다.'],
 ['projector',['remote'],'프로젝터를 선택했지만 리모컨이 확인되지 않았습니다.'],
 ['firepit',['wood','firemat','fireglove'],'불멍을 선택했지만 화로 장비가 모두 확인되지 않았습니다.'],
 ['beans',['grinder','dripper'],'커피 장비 일부가 확인되지 않았습니다.'],
 ['t500',['tensor'],'침낭을 선택했지만 매트가 확인되지 않았습니다.'],
 ['t900',['tensor'],'침낭을 선택했지만 매트가 확인되지 않았습니다.']
];
function dependencyAlerts(){
 const activeIds=new Set(activeItems().map(i=>i.id)), out=[];
 for(const [root,reqs,msg] of deps){
  if(activeIds.has(root) && !state.checks[root]) continue;
  if(activeIds.has(root) && reqs.some(id=>activeIds.has(id) && !state.checks[id])) out.push(msg);
 }
 return [...new Set(out)];
}

function missedAlerts(){
 return (state.missed||[]).filter(m=>m.count>0).map(m=>`🔔 최근 누락: ${m.name}`);
}

function checkboxItem(item){
 const checked=!!state.checks[item.id];
 const recent=(state.missed||[]).some(m=>m.name===item.name && m.count>0);
 return `<div class="item ${checked?'done':''}">
  <input type="checkbox" ${checked?'checked':''} onchange="toggleCheck('${item.id}')">
  <div class="name">${item.name}${recent?` <span class="history">· 최근 누락</span>`:''}<div class="meta">${item.required?'필수':'선택'}</div></div>
  <button class="more" onclick="openEdit('${item.id}')">⋮</button>
 </div>`;
}
function toggleCheck(id){state.checks[id]=!state.checks[id];save();render()}
function toggleRetreat(i){state.checks['retreat_'+i]=!state.checks['retreat_'+i];save();render()}
function toggleKit(id){
 state.kitChecks[id]=!state.kitChecks[id];
 save();render();
}

function renderChoices(){
 function fill(id,opts,key){
  document.getElementById(id).innerHTML=opts.map(([v,n])=>`<button class="${state.config[key]===v?'active':''}" onclick="setCfg('${key}','${v}')">${n}</button>`).join('');
 }
 fill('shelterChoices',shelterOpts,'shelter');
 fill('tarpChoices',tarpOpts,'tarp');
 document.getElementById('chairChoices').innerHTML=chairOpts.map(([v,n])=>`<button class="${(state.config.chairs||[]).includes(v)?'active':''}" onclick="toggleChair('${v}')">${n}</button>`).join('');
 document.getElementById('people1').classList.toggle('active',state.config.people===1);
 document.getElementById('people2').classList.toggle('active',state.config.people===2);
 document.querySelectorAll('[data-nights]').forEach(b=>b.classList.toggle('active',Number(b.dataset.nights)===state.config.nights));
 document.querySelectorAll('[data-cook]').forEach(b=>b.classList.toggle('active',b.dataset.cook===state.config.cook));
 document.querySelectorAll('[data-weather]').forEach(b=>b.classList.toggle('active',b.dataset.weather===state.config.weather));
 document.querySelectorAll('[data-pack]').forEach(b=>{if(b.dataset.pack!=='none')b.classList.toggle('active',(state.config.packs||[]).includes(b.dataset.pack))});
}

function renderKits(){
 if(state.mode==='retreat'){document.getElementById('kitsArea').innerHTML='';return}
 document.getElementById('kitsArea').innerHTML=`<div class="card"><div class="section-title" style="margin-top:0">🧰 상시 수납박스</div>
 ${state.kits.map(k=>`<div class="kit"><div class="kit-head"><input type="checkbox" ${state.kitChecks[k.id]?'checked':''} onchange="toggleKit('${k.id}')"><strong>${k.name} 확인</strong></div>
 <details><summary>박스 안 기본 구성 보기</summary><div class="kit-items">${k.items.join(' · ')}</div></details></div>`).join('')}</div>`;
}

function renderChecklist(){
 const root=document.getElementById('checklist');
 if(state.mode==='retreat'){
  root.innerHTML=`<div class="section-title">🏕️ 철수 체크</div><div class="card">${state.retreat.map((n,i)=>`<div class="item ${state.checks['retreat_'+i]?'done':''}"><input type="checkbox" ${state.checks['retreat_'+i]?'checked':''} onchange="toggleRetreat(${i})"><div class="name">${n}</div></div>`).join('')}</div>`;
  return;
 }
 const items=activeItems();
 let html='';
 for(const cat of state.categories){
   const arr=items.filter(i=>i.cat===cat);
   if(!arr.length) continue;
   html+=`<div class="section-title">${cat}</div><div class="card">${arr.map(checkboxItem).join('')}</div>`;
 }
 root.innerHTML=html;
}

function renderStatus(){
 let total=0,done=0,requiredMissing=0;
 if(state.mode==='retreat'){
  total=state.retreat.length;done=state.retreat.filter((_,i)=>state.checks['retreat_'+i]).length;requiredMissing=total-done;
 }else{
  const items=activeItems(); total=items.length; done=items.filter(i=>state.checks[i.id]).length; requiredMissing=items.filter(i=>i.required&&!state.checks[i.id]).length;
 }
 const dep=state.mode==='depart'?dependencyAlerts():[];
 let txt,badge,cls;
 if(requiredMissing>0){txt='출발 불가';badge=`필수 ${requiredMissing}개 미확인`;cls='bad'}
 else if(dep.length || done<total){txt='확인 필요';badge=`선택 ${Math.max(0,total-done)}개 미확인`;cls='warn'}
 else {txt=state.mode==='depart'?'출발 준비 완료':'철수 완료';badge='완료';cls='ok'}
 document.getElementById('statusText').textContent=txt;
 const b=document.getElementById('statusBadge');b.textContent=badge;b.className='badge '+cls;
 document.getElementById('progressText').textContent=`${done} / ${total}`;
 document.getElementById('progressFill').style.width=(total?done/total*100:0)+'%';
 const alerts=[...dep,...missedAlerts()];
 document.getElementById('alerts').innerHTML=alerts.map((a,i)=>`<div class="alert ${i<dep.length?'bad':''}">${a}</div>`).join('');
}

function renderMissed(){
 const el=document.getElementById('missedList');
 if(!(state.missed||[]).length){el.innerHTML='<div class="small">아직 기록이 없습니다.</div>';return}
 el.innerHTML=state.missed.map((m,i)=>`<div class="item"><div class="name">${m.name}<div class="meta">${m.count}회 기록</div></div><button class="bad ghost" onclick="removeMissed(${i})">삭제</button></div>`).join('');
}

function render(){
 renderChoices();renderKits();renderChecklist();renderStatus();renderMissed();
 document.getElementById('departBtn').classList.toggle('active',state.mode==='depart');
 document.getElementById('retreatBtn').classList.toggle('active',state.mode==='retreat');
}
function populateCats(sel){sel.innerHTML=state.categories.map(c=>`<option>${c}</option>`).join('')}
function openAddModal(){populateCats(document.getElementById('addCategory'));document.getElementById('addName').value='';document.getElementById('addModal').classList.add('show')}
function saveAdd(){
 const name=document.getElementById('addName').value.trim(); if(!name)return;
 state.items.push({id:'custom_'+Date.now(),name,cat:document.getElementById('addCategory').value,required:document.getElementById('addRequired').value==='true',tags:['camp']});
 save();closeModal('addModal');render();
}
let editingId=null;
function openEdit(id){
 editingId=id;const it=state.items.find(x=>x.id===id);if(!it)return;
 populateCats(document.getElementById('editCategory'));
 document.getElementById('editName').value=it.name;document.getElementById('editCategory').value=it.cat;document.getElementById('editRequired').value=String(!!it.required);
 document.getElementById('editModal').classList.add('show')
}
function saveEdit(){
 const it=state.items.find(x=>x.id===editingId);if(!it)return;
 it.name=document.getElementById('editName').value.trim()||it.name;it.cat=document.getElementById('editCategory').value;it.required=document.getElementById('editRequired').value==='true';
 save();closeModal('editModal');render();
}
function deleteEdit(){
 if(!editingId)return;
 state.items=state.items.filter(x=>x.id!==editingId);delete state.checks[editingId];
 save();closeModal('editModal');render();
}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function openMissedModal(){document.getElementById('missedName').value='';document.getElementById('missedModal').classList.add('show')}
function saveMissed(){
 const name=document.getElementById('missedName').value.trim();if(!name)return;
 let m=(state.missed||[]).find(x=>x.name===name);if(m)m.count++;else state.missed.push({name,count:1});
 save();closeModal('missedModal');render();
}
function removeMissed(i){state.missed.splice(i,1);save();render()}

render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
