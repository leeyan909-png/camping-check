<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캠핑 체크</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4e654d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="캠핑 체크">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#292823;--muted:#777268;--line:#ddd7ca;--accent:#4e654d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.app{max-width:760px;margin:auto;padding:18px 14px 90px}header{padding:10px 4px 18px}h1{margin:0;font-size:28px}.sub,.small{color:var(--muted);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}
.modes,.packs{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.packs{grid-template-columns:repeat(3,1fr)}
button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-size:14px}button.active{background:var(--accent);color:white;border-color:var(--accent)}
.progress{display:flex;justify-content:space-between;margin-bottom:8px}.bar{height:8px;background:#e7e2d8;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent);width:0}
h2{font-size:17px;margin:20px 4px 9px}.item{display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:1px solid #eee9df}.item:last-child{border-bottom:0}
.item input{width:20px;height:20px;accent-color:var(--accent)}.item.done span{text-decoration:line-through;color:#aaa}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#ffffffed;border-top:1px solid var(--line);padding:10px}.bottom-inner{max-width:760px;margin:auto;display:flex;gap:8px}.bottom button{flex:1}
@media(max-width:520px){.packs{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<header><h1>🏕️ 캠핑 체크</h1><div class="sub">출발 전 빠짐없이 · 철수 전 놓고 가지 않기 · 자동 저장</div></header>

<div class="panel"><div class="small">캠핑 모드</div><div class="modes" style="margin-top:8px">
<button id="solo" onclick="setMode('solo')">🧍 솔로 캠핑</button>
<button id="duo" onclick="setMode('duo')">👥 2인 캠핑</button>
</div></div>

<div class="panel"><div class="small">오늘 추가할 즐길거리</div><div class="packs" style="margin-top:8px">
<button data-pack="coffee" onclick="togglePack('coffee')">☕ 커피</button>
<button data-pack="movie" onclick="togglePack('movie')">🎬 영화</button>
<button data-pack="fire" onclick="togglePack('fire')">🔥 불멍</button>
<button data-pack="music" onclick="togglePack('music')">🎸 음악</button>
<button data-pack="hike" onclick="togglePack('hike')">🥾 하이킹</button>
<button data-pack="rain" onclick="togglePack('rain')">🌧️ 우천</button>
</div></div>

<div class="panel"><div class="progress"><strong id="count">0 / 0</strong><span id="status">준비 중</span></div><div class="bar"><div class="fill" id="fill"></div></div></div>
<div id="list"></div>
</div>

<div class="bottom"><div class="bottom-inner"><button onclick="checkAll()">전체 확인</button><button onclick="resetChecks()">다시 체크</button></div></div>

<script>
const baseSolo=[
["⛺ 텐트 / 타프",["Hubba Hubba","그라운드시트","블랙코팅 타프","팩 가방","타프 메인폴 / 서브폴","스트링 / 스토퍼","팩 해머","여분 팩"]],
["🪑 테이블 / 체어 / IGT",["IGT 2유닛 테이블","IGT 테이블 다리","폴딩 체어","풋레스트 체어","IGT 1유닛 플레이트 수납","IGT 연결 부품 / 사이드 액세서리","IGT 다리 수납가방","체어 수납가방"]],
["🍳 조리 / 식기",["식기","컵","Snow Peak 보온 텀블러","버너","가스","냄비 / 프라이팬","냄비 집게","라이터","주방가위","칼","도마","조리 집게","키친타월","쓰레기봉투","수세미 / 스펀지","주방세제","지퍼백 / 밀폐봉투","양념"]],
["🛏️ 취침",["NEMO Tensor","ROCK 900 침낭","베개","침낭 라이너","수면안대","귀마개"]],
["💡 전자기기 / 소품 박스",["알루미늄 수납박스","캠핑 랜턴","충전 케이블","보조배터리","멀티 충전기","여분 배터리","손전등","헤드랜턴","모기향","후크","작은 가위","케이블타이","벨크로","테이프","모기 퇴치용품","방수팩","작은 수건"]],
["🧼 청소 / 위생",["물티슈","키친타월","쓰레기봉투","주방세제","스펀지 / 행주","테이블 브러시 / 미니 빗자루","휴지","화장지"]],
["🧊 식품 / 보냉",["쿨러 / 아이스박스","아이스팩","생수","식재료","양념","커피","간식","음료"]],
["🔋 전원 / 차량",["휴대폰","휴대폰 충전 케이블","차량용 충전기","220V 연장선(필요 시)","차 키","캠핑장 예약정보","신분증","지갑","하이패스"]],
["🧯 안전 / 응급",["간단 구급함","밴드","소독 티슈","선크림","모기 기피제"]]
];
const duoExtra=[["👥 2인 추가",["두 번째 체어","두 번째 식기 세트","두 번째 컵","두 번째 보온 텀블러","추가 생수","추가 식재료"]]];
const packs={
coffee:["원두","그라인더","핸드드립 도구","커피 필터"],
movie:["미니 프로젝터","리모컨","프로젝터 충전 케이블","스크린 / 흰색 천"],
fire:["미니 화로대","장작","방염 매트","방염 장갑","소화기 / 소화 스프레이"],
music:["기타","피크","기타 액세서리"],
hike:["등산화 / 트레킹화","등산스틱","배낭","물병 / 워터백","모자"],
rain:["우비 / 우산","방수 점검용품","방수팩","여분 수건","갈아입을 옷"]
};
const packNames={coffee:"커피",movie:"영화",fire:"불멍",music:"음악",hike:"하이킹",rain:"우천"};
let mode=localStorage.mode||"solo",selectedPacks=JSON.parse(localStorage.packs||"[]"),checks=JSON.parse(localStorage.checks||"{}");
function setMode(m){mode=m;localStorage.mode=m;render()}
function togglePack(p){selectedPacks=selectedPacks.includes(p)?selectedPacks.filter(x=>x!==p):[...selectedPacks,p];localStorage.packs=JSON.stringify(selectedPacks);render()}
function key(s){return s.replace(/[^\w\u3131-\u318e\uac00-\ud7a3]/g,"")}
function toggle(item){checks[key(item)]=!checks[key(item)];localStorage.checks=JSON.stringify(checks);render()}
function getSections(){let arr=[...baseSolo];if(mode==="duo")arr=[...arr,...duoExtra];selectedPacks.forEach(p=>arr.push(["🎯 "+packNames[p]+" 팩",packs[p]]));return arr}
function getItems(){return getSections().flatMap(x=>x[1])}
function checkAll(){getItems().forEach(x=>checks[key(x)]=true);localStorage.checks=JSON.stringify(checks);render()}
function resetChecks(){checks={};localStorage.checks="{}";render()}
function render(){
document.getElementById("solo").classList.toggle("active",mode==="solo");document.getElementById("duo").classList.toggle("active",mode==="duo");
document.querySelectorAll("[data-pack]").forEach(b=>b.classList.toggle("active",selectedPacks.includes(b.dataset.pack)));
let total=0,done=0,html="";
getSections().forEach(([title,items])=>{html+=`<h2>${title}</h2><div class="panel">`;items.forEach(item=>{total++;let d=!!checks[key(item)];if(d)done++;html+=`<label class="item ${d?'done':''}"><input type="checkbox" ${d?'checked':''} onchange="toggle('${item.replace(/'/g,"\\'")}')"><span>${item}</span></label>`});html+="</div>"});
document.getElementById("list").innerHTML=html;document.getElementById("count").textContent=`${done} / ${total}`;
document.getElementById("status").textContent=done===total?"🟢 출발 가능":"미확인 "+(total-done)+"개";
document.getElementById("fill").style.width=(total?done/total*100:0)+"%";
}render();
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body></html>
