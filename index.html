<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>캠핑 출발 준비 매니저</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#425443">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="캠핑 매니저">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --bg:#f5f7fa;
  --panel:#ffffff;
  --ink:#111111;
  --muted:#848a92;
  --line:#e1e5ea;
  --blue:#1F6FE5;
  --blue-bright:#4A8CFF;
  --blue-soft:#EAF2FF;
  --ok:#2f6b4b;
  --warn:#9a6b18;
  --bad:#a3483f;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  letter-spacing:-.015em;
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:760px;margin:0 auto;padding:18px 14px 112px}
header{
  padding:14px 2px 18px;
  border-bottom:1px solid var(--line);
  margin-bottom:16px;
}
h1{
  margin:0;
  font-size:27px;
  line-height:1.08;
  font-weight:850;
  letter-spacing:-.045em;
}
.sub{
  color:var(--muted);
  font-size:12px;
  margin-top:7px;
  line-height:1.5;
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:15px;
  margin:12px 0;
}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

button{
  border:1px solid #d5dae1;
  background:#fff;
  border-radius:999px;
  padding:9px 14px;
  color:var(--ink);
  transition:.15s ease;
}
button:hover{
  border-color:var(--blue);
  background:var(--blue-soft);
}
button.active{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
}
button.ghost{background:transparent}
button.bad{color:var(--bad)}

.small{font-size:11px;color:var(--muted)}
.section-title{
  margin:20px 2px 8px;
  font-size:15px;
  font-weight:800;
  color:var(--ink);
}
.choice-title{font-size:12px;color:var(--muted);margin-bottom:6px}

.status{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.status strong{font-size:20px;letter-spacing:-.03em}
.badge{
  display:inline-flex;
  align-items:center;
  font-size:11px;
  padding:5px 8px;
  border-radius:999px;
  border:1px solid var(--line);
  white-space:nowrap;
}
.badge.ok{color:var(--ok);border-color:#bfd2c5;background:#f4faf6}
.badge.warn{color:var(--warn);border-color:#d7c79f;background:#fff9ef}
.badge.bad{color:var(--bad);border-color:#ddb8b2;background:#fff4f2}

.progress{
  height:5px;
  background:#edf0f4;
  border-radius:999px;
  overflow:hidden;
  margin-top:12px;
}
.progress>div{height:100%;background:var(--blue);width:0;transition:.2s}

.alert{
  border-left:3px solid var(--blue);
  background:var(--blue-soft);
  padding:10px 11px;
  border-radius:8px;
  margin:9px 0 0;
  font-size:12px;
  line-height:1.5;
}
.alert.bad{
  border-left-color:var(--bad);
  background:#fff4f2;
  color:var(--bad);
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:50px;
  padding:10px 2px;
  border-bottom:1px solid #edf0f3;
}
.item:last-child{border-bottom:0}
.item input{width:20px;height:20px;accent-color:var(--blue)}
.item .name{flex:1;font-size:14px}
.item.done .name{color:#9aa0a7;text-decoration:none}
.item.done .name:before{content:"✓ ";color:var(--blue);font-weight:800}
.item .meta{font-size:10px;color:#a1a6ad;margin-top:3px}
.item .more{
  border:0;
  padding:4px 7px;
  background:transparent;
  font-size:18px;
  color:var(--muted);
}

details{border-top:1px solid #edf0f3;margin-top:10px;padding-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:12px}
.kit{padding:6px 0}
.kit-head{display:flex;align-items:center;gap:10px}
.kit-head input{width:20px;height:20px;accent-color:var(--blue)}
.kit-items{padding:8px 0 0 30px;font-size:11px;color:var(--muted);line-height:1.8}

.quickbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.quickbar button{flex:1;min-width:112px}
.quickbar button:first-child{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
}
.quickbar button:first-child:hover{background:var(--blue-bright)}

.searchbox{
  width:100%;
  padding:11px 14px;
  border:1px solid #d4d9df;
  border-radius:999px;
  background:#fff;
  margin-top:10px;
  outline:none;
}
.searchbox:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(31,111,229,.11);
}

.cat-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin:18px 2px 8px;
}
.cat-head .section-title{margin:0}
.cat-actions{display:flex;gap:6px}
.cat-actions button{
  padding:6px 10px;
  font-size:11px;
  border-color:#d4d9df;
}
.cat-actions button:first-child{
  color:var(--blue);
  border-color:#bdd0ee;
}

.preset-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.preset-chip{
  padding:7px 10px;
  border-radius:999px;
  font-size:11px;
  border-color:#cbd7e8;
}

.summary-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}
.summary-box{
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px;
  background:#fafbfc;
}
.summary-box:first-child{
  background:var(--blue-soft);
  border-color:#d1def3;
}
.summary-box strong{
  display:block;
  font-size:20px;
  margin-top:3px;
  color:var(--blue);
}

.toolbar{
  position:fixed;
  left:0;right:0;bottom:0;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding:10px max(12px,env(safe-area-inset-right))
          calc(10px + env(safe-area-inset-bottom))
          max(12px,env(safe-area-inset-left));
  z-index:10;
}
.toolbar-inner{
  max-width:760px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}
.toolbar button{
  background:#fff;
  border-radius:12px;
}
.toolbar button.active{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(10,14,20,.55);
  display:none;
  align-items:flex-end;
  z-index:20;
}
.modal.show{display:flex}
.sheet{
  background:var(--panel);
  width:100%;
  max-width:760px;
  margin:auto;
  border-radius:18px 18px 0 0;
  padding:20px 16px 28px;
  max-height:82vh;
  overflow:auto;
  border-top:4px solid var(--blue);
}
.sheet h3{margin:0 0 14px;font-size:18px}
.field{margin:12px 0}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.field input,.field select{
  width:100%;
  padding:11px 12px;
  border:1px solid #d4d9df;
  border-radius:10px;
  background:#fff;
}
.field input:focus,.field select:focus{
  outline:none;
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(31,111,229,.10);
}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.history{font-size:11px;color:var(--blue)}

@media(max-width:560px){
  .grid3{grid-template-columns:1fr 1fr}
  .toolbar-inner{grid-template-columns:1fr 1fr 1fr}
  h1{font-size:23px}
  .card{padding:14px}
}
</style>

</head>
<body>
<div class="app">
<header>
<h1>CAMPING CHECK</h1>
<div class="sub">GEAR CHECK · QUICK SELECT · MISS ALERT · PACK OUT</div>
</header>

<div class="card">
<div class="section-title" style="margin-top:0">빠른 체크</div>
<div class="small">설정 단계 없이 아래 장비를 바로 체크하세요. 여러 항목은 한 번에 선택·해제할 수 있습니다.</div>

<div class="quickbar" style="margin-top:10px">
<button onclick="selectAllVisible()">✓ 전체 선택</button>
<button onclick="clearAllVisible()">－ 전체 해제</button>
<button onclick="newCamping()">↻ 새 캠핑 시작</button>
</div>

<div class="quickbar" style="margin-top:8px">
<button onclick="loadLastTrip()">지난번 그대로</button>
<button onclick="savePreset()">현재 선택 저장</button>
</div>

<div id="presetList" class="preset-list"></div>

<input id="gearSearch" class="searchbox" type="search" placeholder="장비 검색" oninput="renderChecklist()">

<div class="summary-row">
<div class="summary-box"><span class="small">현재 체크</span><strong id="selectedCount">0개</strong></div>
<div class="summary-box"><span class="small">누락 경고</span><strong id="warningCount">0개</strong></div>
</div>
</div>

<div class="card">
<div class="status">
<div>
<div class="small">출발 상태</div>
<strong id="statusText">준비 중</strong>
</div>
<span id="statusBadge" class="badge warn">확인 필요</span>
</div>
<div class="progress"><div id="progressFill"></div></div>
<div class="small" id="progressText" style="margin-top:7px">0 / 0</div>
<div id="alerts"></div>
</div>

<div id="kitsArea"></div>
<div id="checklist"></div>

<div class="card">
<div class="section-title" style="margin-top:0">⚠️ 최근 누락 기록</div>
<div class="small">캠핑장에서 깜빡한 장비를 기록하면 다음 출발 시 상단 경고로 표시됩니다.</div>
<div id="missedList" style="margin-top:10px"></div>
<button style="margin-top:10px;width:100%" onclick="openMissedModal()">＋ 이번에 깜빡한 물건 기록</button>
</div>

<div class="toolbar">
<div class="toolbar-inner">
<button onclick="switchMode('depart')" id="departBtn">🚙 출발</button>
<button onclick="switchMode('retreat')" id="retreatBtn">🏕️ 철수</button>
<button onclick="openAddModal()">＋ 장비</button>
</div>
</div>

<div id="editModal" class="modal" onclick="if(event.target===this)closeModal('editModal')">
<div class="sheet">
<h3 id="editTitle">장비 편집</h3>
<div class="field"><label>장비명</label><input id="editName"></div>
<div class="field"><label>카테고리</label><select id="editCategory"></select></div>
<div class="field"><label>중요도</label><select id="editRequired"><option value="true">필수</option><option value="false">선택</option></select></div>
<div class="sheet-actions"><button onclick="saveEdit()">저장</button><button class="bad" onclick="deleteEdit()">삭제</button></div>
<button style="width:100%;margin-top:8px" onclick="closeModal('editModal')">취소</button>
</div></div>

<div id="addModal" class="modal" onclick="if(event.target===this)closeModal('addModal')">
<div class="sheet">
<h3>장비 추가</h3>
<div class="field"><label>장비명</label><input id="addName" placeholder="예: 블루투스 스피커"></div>
<div class="field"><label>카테고리</label><select id="addCategory"></select></div>
<div class="field"><label>중요도</label><select id="addRequired"><option value="true">필수</option><option value="false">선택</option></select></div>
<div class="sheet-actions"><button onclick="saveAdd()">추가</button><button onclick="closeModal('addModal')">취소</button></div>
</div></div>

<div id="missedModal" class="modal" onclick="if(event.target===this)closeModal('missedModal')">
<div class="sheet">
<h3>이번에 깜빡한 물건</h3>
<div class="field"><label>장비명</label><input id="missedName" placeholder="예: 가스"></div>
<div class="sheet-actions"><button onclick="saveMissed()">기록</button><button onclick="closeModal('missedModal')">취소</button></div>
</div></div>

function clone(x){return JSON.parse(JSON.stringify(x))}
let state=load();
function load(){
 try{
  const s=JSON.parse(localStorage.getItem(STORAGE)||'null');
  if(!s) return clone(DEFAULTS);
  const d=clone(DEFAULTS);
  return {...d,...s,config:{...d.config,...(s.config||{})},items:s.items||d.items,categories:s.categories||d.categories,kits:s.kits||d.kits,retreat:s.retreat||d.retreat};
 }catch(e){return clone(DEFAULTS)}
}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function setCfg(k,v){state.config[k]=v;save();render()}
function togglePack(p){let a=state.config.packs||[];state.config.packs=a.includes(p)?a.filter(x=>x!==p):[...a,p];save();render()}
function clearPacks(){state.config.packs=[];save();render()}
function toggleChair(ch){
 let a=state.config.chairs||[];
 state.config.chairs=a.includes(ch)?a.filter(x=>x!==ch):[...a,ch];
 save();render()
}
function switchMode(m){state.mode=m;save();render()}

const shelterOpts=[['hubba','MSR 허바허바 LT2'],['living','스노우피크 리빙쉘'],['landlock','스노우피크 랜드록']];
const tarpOpts=[['none','사용 안 함'],['black','블랙코팅 타프'],['buffalo','버팔로 타프']];
const chairOpts=[
 ['sunset','헬리녹스 선셋체어'],
 ['savanna','헬리녹스 사바나체어'],
 ['cargo_khaki','카고컨테이너 체어 카키'],
 ['cargo_tan','카고컨테이너 체어 탄'],
 ['kazmi','카즈미 체어'],
 ['bp_white','백패킹 체어 화이트'],
 ['bp_orange','백패킹 체어 오렌지']
];

function hasTag(item,tag){return (item.tags||[]).includes(tag)}
function activeItem(item){ return true; }
function activeItems(){return state.items.filter(activeItem)}

const deps=[
 ['igt2',['igtleg'],'IGT 테이블을 선택했지만 테이블 다리가 확인되지 않았습니다.'],
 ['burner',['gas','lighter'],'버너를 선택했지만 가스 또는 라이터가 확인되지 않았습니다.'],
 ['blacktarp',['tarppole','guyline','hammer'],'타프를 선택했지만 설치 장비가 모두 확인되지 않았습니다.'],
 ['buffalotarp',['tarppole','guyline','hammer'],'타프를 선택했지만 설치 장비가 모두 확인되지 않았습니다.'],
 ['projector',['remote'],'프로젝터를 선택했지만 리모컨이 확인되지 않았습니다.'],
 ['firepit',['wood','firemat','fireglove'],'불멍을 선택했지만 화로 장비가 모두 확인되지 않았습니다.'],
 ['beans',['grinder','dripper'],'커피 장비 일부가 확인되지 않았습니다.'],
 ['t500',['tensor'],'침낭을 선택했지만 매트가 확인되지 않았습니다.'],
 ['t900',['tensor'],'침낭을 선택했지만 매트가 확인되지 않았습니다.']
];
function dependencyAlerts(){
 const out=[];
 for(const [root,reqs,msg] of deps){
   if(!state.checks[root]) continue;
   if(reqs.some(id=>!state.checks[id])) out.push(msg);
 }
 return [...new Set(out)];
}

function missedAlerts(){
 return (state.missed||[]).filter(m=>m.count>0).map(m=>`🔔 최근 누락: ${m.name}`);
}

function checkboxItem(item){
 const checked=!!state.checks[item.id];
 const recent=(state.missed||[]).some(m=>m.name===item.name && m.count>0);
 return `<div class="item ${checked?'done':''}">
  <input type="checkbox" ${checked?'checked':''} onchange="toggleCheck('${item.id}')">
  <div class="name">${item.name}${recent?` <span class="history">· 최근 누락</span>`:''}<div class="meta">${item.required?'필수':'선택'}</div></div>
  <button class="more" onclick="openEdit('${item.id}')">⋮</button>
 </div>`;
}
function toggleCheck(id){state.checks[id]=!state.checks[id];save();render()}
function toggleRetreat(i){state.checks['retreat_'+i]=!state.checks['retreat_'+i];save();render()}
function toggleKit(id){
 state.kitChecks[id]=!state.kitChecks[id];
 save();render();
}

function renderKits(){
 if(state.mode==='retreat'){document.getElementById('kitsArea').innerHTML='';return}
 document.getElementById('kitsArea').innerHTML=`<div class="card"><div class="section-title" style="margin-top:0">🧰 상시 수납박스</div>
 ${state.kits.map(k=>`<div class="kit"><div class="kit-head"><input type="checkbox" ${state.kitChecks[k.id]?'checked':''} onchange="toggleKit('${k.id}')"><strong>${k.name} 확인</strong></div>
 <details><summary>박스 안 기본 구성 보기</summary><div class="kit-items">${k.items.join(' · ')}</div></details></div>`).join('')}</div>`;
}

function renderChecklist(){
 const root=document.getElementById('checklist');
 if(state.mode==='retreat'){
  root.innerHTML=`<div class="section-title">🏕️ 철수 체크</div><div class="card">${state.retreat.map((n,i)=>`<div class="item ${state.checks['retreat_'+i]?'done':''}"><input type="checkbox" ${state.checks['retreat_'+i]?'checked':''} onchange="toggleRetreat(${i})"><div class="name">${n}</div></div>`).join('')}</div>`;
  return;
 }
 const q=(document.getElementById('gearSearch')?.value||'').trim().toLowerCase();
 const items=activeItems().filter(i=>!q || i.name.toLowerCase().includes(q) || i.cat.toLowerCase().includes(q));
 let html='';
 for(const cat of state.categories){
   const arr=items.filter(i=>i.cat===cat);
   if(!arr.length) continue;
   html+=`<div class="cat-head">
     <div class="section-title">${cat}</div>
     <div class="cat-actions">
       <button onclick="selectCategory('${cat.replace(/'/g,"\'")}')">전체 선택</button>
       <button onclick="clearCategory('${cat.replace(/'/g,"\'")}')">해제</button>
     </div>
   </div>
   <div class="card">${arr.map(checkboxItem).join('')}</div>`;
 }
 root.innerHTML=html || '<div class="card"><div class="small">검색 결과가 없습니다.</div></div>';
}

function renderStatus(){
 let total=0,done=0;
 if(state.mode==='retreat'){
  total=state.retreat.length;
  done=state.retreat.filter((_,i)=>state.checks['retreat_'+i]).length;
 }else{
  const items=activeItems();
  total=items.length;
  done=items.filter(i=>state.checks[i.id]).length;
 }
 const dep=state.mode==='depart'?dependencyAlerts():[];
 let txt,badge,cls;
 if(state.mode==='retreat'){
   if(done===total){txt='철수 완료';badge='완료';cls='ok'}
   else {txt='철수 체크 중';badge=`${total-done}개 남음`;cls='warn'}
 }else{
   if(dep.length){txt='누락 확인 필요';badge=`경고 ${dep.length}개`;cls='bad'}
   else if(done>0){txt='누락 경고 없음';badge=`${done}개 체크`;cls='ok'}
   else {txt='체크 시작 전';badge='장비를 선택하세요';cls='warn'}
 }
 document.getElementById('statusText').textContent=txt;
 const b=document.getElementById('statusBadge');b.textContent=badge;b.className='badge '+cls;
 document.getElementById('progressText').textContent=`${done} / ${total}`;
 document.getElementById('progressFill').style.width=(total?done/total*100:0)+'%';
 const alerts=[...dep,...missedAlerts()];
 document.getElementById('alerts').innerHTML=alerts.map((a,i)=>`<div class="alert ${i<dep.length?'bad':''}">${a}</div>`).join('');
 const sc=document.getElementById('selectedCount'); if(sc) sc.textContent=done+'개';
 const wc=document.getElementById('warningCount'); if(wc) wc.textContent=dep.length+'개';
}

function renderMissed(){
 const el=document.getElementById('missedList');
 if(!(state.missed||[]).length){el.innerHTML='<div class="small">아직 기록이 없습니다.</div>';return}
 el.innerHTML=state.missed.map((m,i)=>`<div class="item"><div class="name">${m.name}<div class="meta">${m.count}회 기록</div></div><button class="bad ghost" onclick="removeMissed(${i})">삭제</button></div>`).join('');
}


function selectedIds(){
 return activeItems().filter(i=>state.checks[i.id]).map(i=>i.id);
}
function selectAllVisible(){
 const q=(document.getElementById('gearSearch')?.value||'').trim().toLowerCase();
 activeItems().filter(i=>!q || i.name.toLowerCase().includes(q) || i.cat.toLowerCase().includes(q))
   .forEach(i=>state.checks[i.id]=true);
 save();render();
}
function clearAllVisible(){
 const q=(document.getElementById('gearSearch')?.value||'').trim().toLowerCase();
 activeItems().filter(i=>!q || i.name.toLowerCase().includes(q) || i.cat.toLowerCase().includes(q))
   .forEach(i=>delete state.checks[i.id]);
 save();render();
}
function selectCategory(cat){
 activeItems().filter(i=>i.cat===cat).forEach(i=>state.checks[i.id]=true);
 save();render();
}
function clearCategory(cat){
 activeItems().filter(i=>i.cat===cat).forEach(i=>delete state.checks[i.id]);
 save();render();
}
function newCamping(){
 const current=selectedIds();
 if(current.length) state.lastTrip=current;
 state.checks={};
 state.kitChecks={};
 state.mode='depart';
 save();render();
}
function loadLastTrip(){
 const ids=state.lastTrip||[];
 if(!ids.length){alert('저장된 지난 캠핑 선택이 없습니다.');return}
 state.checks={};
 ids.forEach(id=>state.checks[id]=true);
 save();render();
}
function savePreset(){
 const ids=selectedIds();
 if(!ids.length){alert('먼저 저장할 장비를 체크하세요.');return}
 const name=prompt('프리셋 이름을 입력하세요.','솔로 기본');
 if(!name) return;
 state.presets=state.presets||[];
 const old=state.presets.find(p=>p.name===name);
 if(old) old.ids=ids;
 else state.presets.push({name,ids});
 save();render();
}
function loadPreset(i){
 const p=(state.presets||[])[i]; if(!p)return;
 state.checks={};
 p.ids.forEach(id=>state.checks[id]=true);
 save();render();
}
function deletePreset(i){
 if(!confirm('이 프리셋을 삭제할까요?'))return;
 state.presets.splice(i,1);save();render();
}
function renderPresets(){
 const el=document.getElementById('presetList'); if(!el)return;
 const ps=state.presets||[];
 el.innerHTML=ps.map((p,i)=>`<button class="preset-chip" onclick="loadPreset(${i})">${p.name}</button><button class="preset-chip bad" onclick="deletePreset(${i})">×</button>`).join('');
}

function render(){
 renderKits();renderChecklist();renderStatus();renderMissed();renderPresets();
 document.getElementById('departBtn').classList.toggle('active',state.mode==='depart');
 document.getElementById('retreatBtn').classList.toggle('active',state.mode==='retreat');
}
function populateCats(sel){sel.innerHTML=state.categories.map(c=>`<option>${c}</option>`).join('')}
function openAddModal(){populateCats(document.getElementById('addCategory'));document.getElementById('addName').value='';document.getElementById('addModal').classList.add('show')}
function saveAdd(){
 const name=document.getElementById('addName').value.trim(); if(!name)return;
 state.items.push({id:'custom_'+Date.now(),name,cat:document.getElementById('addCategory').value,required:document.getElementById('addRequired').value==='true',tags:['camp']});
 save();closeModal('addModal');render();
}
let editingId=null;
function openEdit(id){
 editingId=id;const it=state.items.find(x=>x.id===id);if(!it)return;
 populateCats(document.getElementById('editCategory'));
 document.getElementById('editName').value=it.name;document.getElementById('editCategory').value=it.cat;document.getElementById('editRequired').value=String(!!it.required);
 document.getElementById('editModal').classList.add('show')
}
function saveEdit(){
 const it=state.items.find(x=>x.id===editingId);if(!it)return;
 it.name=document.getElementById('editName').value.trim()||it.name;it.cat=document.getElementById('editCategory').value;it.required=document.getElementById('editRequired').value==='true';
 save();closeModal('editModal');render();
}
function deleteEdit(){
 if(!editingId)return;
 state.items=state.items.filter(x=>x.id!==editingId);delete state.checks[editingId];
 save();closeModal('editModal');render();
}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function openMissedModal(){document.getElementById('missedName').value='';document.getElementById('missedModal').classList.add('show')}
function saveMissed(){
 const name=document.getElementById('missedName').value.trim();if(!name)return;
 let m=(state.missed||[]).find(x=>x.name===name);if(m)m.count++;else state.missed.push({name,count:1});
 save();closeModal('missedModal');render();
}
function removeMissed(i){state.missed.splice(i,1);save();render()}

render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
